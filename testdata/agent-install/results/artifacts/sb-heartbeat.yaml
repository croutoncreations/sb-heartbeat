# yaml-language-server: $schema=https://raw.githubusercontent.com/croutoncreations/sb-heartbeat/main/schema/sb-heartbeat.schema.json
version: 1
defaults:
  timeout: 10s
  retries: 1
  retry_backoff: 2s
  concurrency: 4
  output: text
scheduler:
  cron: 37 3,11,19 * * *
projects:
  - name: evaluation-stage
    url:
      env: EVALUATION_SUPABASE_URL
      github: variable
    api_key:
      env: EVALUATION_SUPABASE_API_KEY
      github: secret
