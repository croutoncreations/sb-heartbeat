name: Cloudflare live integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-live:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: hosted-supabase-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0
      - run: go build -o "${RUNNER_TEMP}/sb-heartbeat" ./cmd/sb-heartbeat
      - name: Install locked dependencies and verify generated contract without credentials
        run: scripts/integration-cloudflare-live.sh prepare "${RUNNER_TEMP}/sb-heartbeat" "${RUNNER_TEMP}/cloudflare-live-worker"
      - name: Deploy, inspect, execute, and remove the live fixture
        run: scripts/integration-cloudflare-live.sh live "${RUNNER_TEMP}/cloudflare-live-worker"
        env:
          SB_HEARTBEAT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SB_HEARTBEAT_CLOUDFLARE_ACCOUNT_ID }}
          SB_HEARTBEAT_CLOUDFLARE_API_TOKEN: ${{ secrets.SB_HEARTBEAT_CLOUDFLARE_API_TOKEN }}
          SB_HEARTBEAT_CLOUDFLARE_PUBLISHABLE_URL: ${{ secrets.SB_HEARTBEAT_HOSTED_URL }}
          SB_HEARTBEAT_CLOUDFLARE_PUBLISHABLE_KEY: ${{ secrets.SB_HEARTBEAT_HOSTED_PUBLISHABLE_KEY }}
          SB_HEARTBEAT_CLOUDFLARE_ANON_URL: ${{ secrets.SB_HEARTBEAT_CLOUDFLARE_ANON_URL }}
          SB_HEARTBEAT_CLOUDFLARE_ANON_KEY: ${{ secrets.SB_HEARTBEAT_CLOUDFLARE_ANON_KEY }}
