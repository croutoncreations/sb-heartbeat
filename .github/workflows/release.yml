name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  calendar-delivery:
    uses: ./.github/workflows/calendar-smoke.yml

  hosted-supabase:
    runs-on: ubuntu-latest
    environment: hosted-supabase-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: psql --version
      - run: go build -o "${RUNNER_TEMP}/sb-heartbeat" ./cmd/sb-heartbeat
      - run: scripts/integration-hosted-supabase.sh "${RUNNER_TEMP}/sb-heartbeat"
        env:
          SB_HEARTBEAT_REQUIRE_HOSTED: "1"
          SB_HEARTBEAT_HOSTED_DATABASE_URL: ${{ secrets.SB_HEARTBEAT_HOSTED_DATABASE_URL }}
          SB_HEARTBEAT_HOSTED_URL: ${{ secrets.SB_HEARTBEAT_HOSTED_URL }}
          SB_HEARTBEAT_HOSTED_PUBLISHABLE_KEY: ${{ secrets.SB_HEARTBEAT_HOSTED_PUBLISHABLE_KEY }}
          SB_HEARTBEAT_HOSTED_ANON_KEY: ${{ secrets.SB_HEARTBEAT_HOSTED_ANON_KEY }}

  release:
    needs:
      - verify
      - calendar-delivery
      - hosted-supabase
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an exact semantic version" >&2
            exit 1
          fi
      - name: Build draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify local release artifacts
        shell: bash
        run: scripts/verify-release-artifacts.sh dist "${RELEASE_TAG#v}"
      - name: Require complete draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" != true ]]; then
            echo "GoReleaser did not leave a draft release; refusing to attest" >&2
            exit 1
          fi
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest release checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/checksums.txt
      - name: Verify draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_assets="${RUNNER_TEMP}/sb-heartbeat-release-assets"
          mkdir "${remote_assets}"
          gh release download "${RELEASE_TAG}" --dir "${remote_assets}"
          cmp --silent dist/checksums.txt "${remote_assets}/checksums.txt"
          scripts/verify-release-artifacts.sh "${remote_assets}" "${RELEASE_TAG#v}" --exact
      - name: Publish attested immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 {print $1}')"
          if [[ -z "${remote_tag_sha}" ]]; then
            remote_tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 {print $1}')"
          fi
          if [[ -z "${remote_tag_sha}" || "${remote_tag_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Remote release tag no longer identifies the triggering commit; refusing to publish" >&2
            exit 1
          fi
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" != true ]]; then
            echo "Release became public before final publication; refusing to continue" >&2
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" --draft=false --verify-tag
          immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.immutable // false')"
          if [[ "${immutable}" != true ]]; then
            echo "Published release is not immutable" >&2
            exit 1
          fi

  publish-container:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/croutoncreations/sb-heartbeat
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:v0.23.1@sha256:dbc2dfd9342fd5c891ea94e9774c15cab985681e5ff995a9e366066aa0b9b2b4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate unclaimed release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an exact semantic version" >&2
            exit 1
          fi
          inspection_error="${RUNNER_TEMP}/sb-heartbeat-ghcr-initial-inspect.err"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" >/dev/null 2>"${inspection_error}"; then
            echo "Container release tag already exists; refusing to replace it" >&2
            exit 1
          fi
          if ! grep -Eq '(^|: )(manifest unknown|name unknown|not found)(:|$)' "${inspection_error}"; then
            echo "Could not prove the container release tag is absent; refusing to publish" >&2
            exit 1
          fi
          rm -f "${inspection_error}"
      - name: Build and push release digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          provenance: mode=max
          sbom: true
      - name: Attest release digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Promote attested digest to version tag
        if: success()
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not return a valid sha256 digest" >&2
            exit 1
          fi
          inspection_error="${RUNNER_TEMP}/sb-heartbeat-ghcr-final-inspect.err"
          if docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" >/dev/null 2>"${inspection_error}"; then
            echo "Container release tag appeared during publication; refusing to replace it" >&2
            exit 1
          fi
          if ! grep -Eq '(^|: )(manifest unknown|name unknown|not found)(:|$)' "${inspection_error}"; then
            echo "Could not prove the container release tag is absent; refusing to promote" >&2
            exit 1
          fi
          rm -f "${inspection_error}"
          docker buildx imagetools create --tag "${IMAGE_NAME}:${RELEASE_TAG}" "${IMAGE_NAME}@${IMAGE_DIGEST}"
