name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  hosted-supabase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: psql --version
      - run: go build -o "${RUNNER_TEMP}/sb-heartbeat" ./cmd/sb-heartbeat
      - run: scripts/integration-hosted-supabase.sh "${RUNNER_TEMP}/sb-heartbeat"
        env:
          SB_HEARTBEAT_REQUIRE_HOSTED: "1"
          SB_HEARTBEAT_HOSTED_DATABASE_URL: ${{ secrets.SB_HEARTBEAT_HOSTED_DATABASE_URL }}
          SB_HEARTBEAT_HOSTED_URL: ${{ secrets.SB_HEARTBEAT_HOSTED_URL }}
          SB_HEARTBEAT_HOSTED_PUBLISHABLE_KEY: ${{ secrets.SB_HEARTBEAT_HOSTED_PUBLISHABLE_KEY }}
          SB_HEARTBEAT_HOSTED_ANON_KEY: ${{ secrets.SB_HEARTBEAT_HOSTED_ANON_KEY }}

  release:
    needs:
      - verify
      - hosted-supabase
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
